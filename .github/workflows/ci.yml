name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  # Weekly advisory scan; see the deny job.
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Every job only reads the repository.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # alsa-sys links against ALSA at build time; the rest of the native
      # deps (x11, wayland, xkbcommon) are dlopened at runtime.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # COD_DIR is unset here, so tests that need the retail paks return
      # early (vcod_common::testing::game_fs). What runs is the parser,
      # protocol and logic suite, plus the committed net captures.
      - name: Test
        run: cargo test --workspace

  # deny.toml: licences, the layering bans and sources on every run;
  # advisories only on the weekly schedule, so a new advisory does not
  # block an unrelated merge.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2.1.2
        with:
          command: check ${{ github.event_name == 'schedule' && 'advisories' || 'bans licenses sources' }}
