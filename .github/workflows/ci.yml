name: CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # alsa-sys links against ALSA at build time; the rest of the native
      # deps (x11, wayland, xkbcommon) are dlopened at runtime.
      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - run: rustup component add rustfmt clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # COD_DIR is unset here, so tests that need the retail paks return
      # early (vcod_common::testing::game_fs). What runs is the parser,
      # protocol and logic suite, plus the committed net captures.
      - name: Test
        run: cargo test --workspace
