[package]
name = "vcod-cod2"
description = "Call of Duty 2 1.3 formats and wire for vcod"
# tests/main.rs links every test file into one binary (`cargo test --test cod2`).
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
glam.workspace = true
log.workspace = true
vcod-common = { path = "../common" }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "cod2"
path = "tests/main.rs"
