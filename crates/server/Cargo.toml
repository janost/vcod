[package]
name = "vcod-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false
build = "../version.rs"
description = "Dedicated server for Call of Duty 1.1 and 1.5, United Offensive, Call of Duty 2 and Call of Duty 4"
# tests/main.rs links every test file into one binary (`cargo test --test server`).
autotests = false

# `testing`: the test seams on `Server` and the levels (`test_*`,
# `*_for_test`) for the tests of this crate and the client.
[features]
testing = ["vcod-common/testing", "vcod-cod4/testing"]

[dependencies]
vcod-common.workspace = true
vcod-gsc.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
env_logger.workspace = true
log.workspace = true
glam.workspace = true
vcod-cod2 = { path = "../cod2" }
vcod-cod4 = { path = "../cod4" }

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
vcod-server = { path = ".", features = ["testing"] }
tempfile.workspace = true

[[test]]
name = "server"
path = "tests/main.rs"

[lints]
workspace = true
