[package]
name = "vcod-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false
build = "../version.rs"
description = "Call of Duty (2003) 1.1 dedicated server, in progress"
# tests/main.rs links every test file into one binary (`cargo test --test server`).
autotests = false

[dependencies]
vcod-common.workspace = true
vcod-gsc.workspace = true
anyhow.workspace = true
clap.workspace = true
ctrlc.workspace = true
env_logger.workspace = true
log.workspace = true
glam.workspace = true
vcod-cod2 = { path = "../cod2" }
vcod-cod4 = { path = "../cod4" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[[test]]
name = "server"
path = "tests/main.rs"
