[package]
name = "vcod-common"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
rust-version.workspace = true
publish = false
description = "What the vcod games share: formats, collision, movement and the Call of Duty 1.1, 1.5 and United Offensive network protocol"
# tests/main.rs links every test file into one binary (`cargo test --test common`).
autotests = false

# The `testing` module and the test worlds, for other crates' tests: each
# turns it on from its dev-dependencies, so no release build carries them.
[features]
testing = []

[dependencies]
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
log.workspace = true
zip.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
vcod-common = { path = ".", features = ["testing"] }
tempfile.workspace = true

[[test]]
name = "common"
path = "tests/main.rs"

[lints]
workspace = true
