[package]
name = "vcod-cod4"
description = "Call of Duty 4 1.7 formats for vcod"
# tests/main.rs links every test file into one binary (`cargo test --test cod4`).
autotests = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
publish = false

# `testing`: the install lookups, as vcod-common's feature of that name.
[features]
testing = ["vcod-common/testing"]

[dependencies]
anyhow.workspace = true
# The zlib backend zip already builds (zlib-rs), so no second inflater.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
vcod-common = { path = "../common" }
glam.workspace = true
# CoD4x 21's mode 2 stats block is AES-128-CBC (net::reliable, cod4x-protocol.md 7.1).
aes = "0.8"
cbc = "0.1"
log.workspace = true

[dev-dependencies]
vcod-cod4 = { path = ".", features = ["testing"] }
tempfile.workspace = true

[[test]]
name = "cod4"
path = "tests/main.rs"

[lints]
workspace = true
