[workspace]
resolver = "2"
members = ["crates/common", "crates/client", "crates/server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/janost/vcod"
readme = "README.md"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
env_logger = "0.11"
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["tga", "jpeg"] }
kira = { version = "0.12", default-features = false, features = ["cpal", "mp3", "wav", "pcm"] }
log = "0.4"
pollster = "1"
winit = "0.30"
wgpu = "30"
zip = { version = "8", default-features = false, features = ["deflate"] }
tempfile = "3"
vcod-common = { path = "crates/common" }

# Release binaries ship to the nightly release; the symbol table is most of
# their size and nothing reads it. Panic backtraces lose function names.
[profile.release]
strip = "symbols"

# kira/symphonia/cpal are unusably slow unoptimized (crackle, seconds per
# decode); optimizing every dependency in dev builds costs one cold build.
# Profiles only take effect at the workspace root.
[profile.dev.package."*"]
opt-level = 3
