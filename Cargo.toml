[workspace]
resolver = "3"
members = ["crates/common", "crates/client", "crates/server", "crates/gsc", "crates/cod2", "crates/cod4"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/janost/vcod"
readme = "README.md"
rust-version = "1.95"

# rustc 1.100's clippy widened this lint to loops that index several arrays
# or walk a bit mask by position, the shape the retail ports keep on purpose.
[workspace.lints.rust]
# Unsafe code stays in the modules that `#![allow]` it.
unsafe_code = "deny"

[workspace.lints.clippy]
needless_range_loop = "allow"

[workspace.dependencies]
anyhow = "1"
jiff = "0.2"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
# No `regex`: RUST_LOG takes plain targets and levels here.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
glam = "0.33"
image = { version = "0.25", default-features = false, features = ["tga", "jpeg"] }
# kira 0.12.6 moved to glam 0.34, a second glam beside the workspace's 0.33.
kira = { version = "=0.12.5", default-features = false, features = ["cpal", "mp3", "wav", "pcm"] }
log = "0.4"
# CoD4 voice chat: the microphone (kira already builds cpal) and libspeex,
# opened at run time (client cod4_voice.rs).
cpal = { version = "0.18", default-features = false }
libloading = "0.8"
# kira's own decoder, opened directly so a stream can be resampled (client audio/stream.rs).
symphonia = { version = "0.6", default-features = false, features = ["mp3", "wav", "pcm"] }
pollster = "1"
winit = "0.30"
wgpu = "30"
# `deflate` would add zopfli, a compressor only a ZipWriter above level 9 uses.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile = "3"
vcod-common = { path = "crates/common" }
vcod-gsc = { path = "crates/gsc" }

# Release binaries ship to the nightly release; the symbol table is most of
# their size and nothing reads it. Panic backtraces lose function names.
[profile.release]
strip = "symbols"

# kira/symphonia/cpal are unusably slow unoptimized (crackle, seconds per
# decode); optimizing every dependency in dev builds costs one cold build.
# Profiles only take effect at the workspace root.
# Full debuginfo made each test binary ~150 MB, mostly DWARF; line tables
# keep file:line in backtraces.
[profile.dev]
debug = "line-tables-only"
# The suites spend most of their CPU in pmove, collision and the gsc VM;
# at opt-level 0 the workspace suite took 143 s, at 1 it takes 31 s, and an
# edit rebuilds no slower.
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
